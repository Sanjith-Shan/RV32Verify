# riscv-formal configuration for rv32_core (RV32I, aligned memory convention).
# The core RTL is elaborated by yosys-slang into rv32_core_netlist.v first
# (scripts/run_formal.sh), because riscv-formal reads plain Verilog.

[options]
isa rv32i

[depth]
insn            20
reg       15    25
pc_fwd    10    30
pc_bwd    10    30
liveness  1  10 30
unique    1  10 30
causal    10    30
ill             15
cover     1     15

[sort]
reg_ch0

[defines]
`define RISCV_FORMAL_ALIGNED_MEM

[defines liveness]
`define RV32VERIFY_FAIRNESS

[verilog-files]
@basedir@/cores/@core@/wrapper.sv
@basedir@/cores/@core@/rv32_core_netlist.v

[cover]
always @* if (!reset) cover (channel[0].cnt_insns == 2);
